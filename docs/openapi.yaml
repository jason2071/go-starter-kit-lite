openapi: 3.0.3
info:
  title: Go Fiber Clean Lite API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        '200': {description: OK}
  /api/v1/auth/register:
    post:
      summary: Register
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegisterRequest'}
      responses:
        '201': {description: Created}
  /api/v1/auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200': {description: OK}
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token
      responses:
        '200': {description: OK}
  /api/v1/auth/me:
    get:
      summary: Current user
      security: [{bearerAuth: []}]
      responses:
        '200': {description: OK}
  /api/v1/users:
    get:
      summary: List users (admin)
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: page, schema: {type: integer, default: 1}}
        - {in: query, name: page_size, schema: {type: integer, default: 20, maximum: 100}}
        - {in: query, name: search, schema: {type: string}}
        - {in: query, name: is_active, schema: {type: boolean}}
        - {in: query, name: sort, schema: {type: string, enum: [created_at, updated_at, email, name]}}
        - {in: query, name: order, schema: {type: string, enum: [asc, desc]}}
      responses:
        '200': {description: OK}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 8, maxLength: 72}
        name: {type: string, minLength: 2, maxLength: 255}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
